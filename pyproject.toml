[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "separador-nominas"
version = "2.5.0"
description = "Aplicación de escritorio para separar y agrupar nóminas PDF por trabajador."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "SeparadorNominas" },
]
keywords = ["pdf", "nominas", "escritorio", "windows", "tkinter"]
dependencies = [
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
    "xlrd==1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "reportlab>=4.0.0",
    "xlwt>=1.3.0",
]

[project.scripts]
separador-nominas = "separador_nominas.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["separador_nominas"]

[tool.coverage.report]
show_missing = true
skip_covered = false
omit = [
    "*/separador_nominas/gui.py",
    "*/separador_nominas/main.py",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["separador_nominas"]
